name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # divoom.app references the library by relative path
      # (../divoom.net/divoom.net/Divoom.net.csproj), so both repos are
      # checked out side by side in the workspace.
      - uses: actions/checkout@v7
        with:
          path: divoom.app

      - uses: actions/checkout@v7
        with:
          repository: billydavis/divoom.net
          ref: main
          path: divoom.net

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore divoom.app/divoom.app.slnx -p:Platform=x64

      - name: Build
        run: dotnet build divoom.app/divoom.app.slnx --configuration Release --no-restore -p:Platform=x64
