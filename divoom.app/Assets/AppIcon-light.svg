  <!-- Monitor stand neck -->
  <rect x="112" y="184" width="32" height="24" rx="4" fill="#16162E"/>
  <!-- Monitor base -->
  <rect x="80" y="204" width="96" height="14" rx="7" fill="#16162E"/>

  <!-- Screen glow overlay -->
  <rect x="32" y="36" width="192" height="136" rx="6" ry="6" fill="url(#glow)" opacity="0.12"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
